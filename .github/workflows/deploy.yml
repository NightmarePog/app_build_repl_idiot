name: Check and upload to Tour de Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourdecloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check backend
        working-directory: backend
        run: ./gradlew --no-daemon check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm api:check
          pnpm test:api
          pnpm lint
          pnpm check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: End-to-end tests (shard ${{ matrix.shard }}/4)
        working-directory: frontend
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-disposable-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject breaking API changes
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CONTRACT_BASE" ] || [ "$CONTRACT_BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$CONTRACT_BASE^{commit}" 2>/dev/null; then
            CONTRACT_BASE=$(git rev-parse HEAD^)
          fi
          mkdir -p backend/build/openapi
          contract_path=backend/openapi/openapi.json
          if ! git cat-file -e "$CONTRACT_BASE:$contract_path" 2>/dev/null; then
            contract_path=frontend/openapi.json
          fi
          if git cat-file -e "$CONTRACT_BASE:$contract_path" 2>/dev/null; then
            git show "$CONTRACT_BASE:$contract_path" > backend/build/openapi/base.json
            docker run --rm -v "$PWD:/specs:ro" tufin/oasdiff:v1.32.1 \
              breaking --fail-on WARN \
              /specs/backend/build/openapi/base.json /specs/backend/openapi/openapi.json
          else
            echo 'No previous OpenAPI contract; this change establishes the baseline.'
          fi
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Check Caddy configuration
        run: docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
      - name: Test application
        run: python3 scripts/smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop stack
        if: always()
        run: docker compose down -v

  upload:
    needs: [backend, frontend, e2e, stack]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check deployment settings
        env:
          TDC_TOKEN: ${{ secrets.TDC_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$POSTGRES_PASSWORD" || { echo 'Add repository secret POSTGRES_PASSWORD.'; exit 1; }
          test -n "$TDC_TOKEN" || { echo 'Add repository secret TDC_TOKEN.'; exit 1; }
      - name: Upload to Tour de Cloud
        uses: studentscangrow/upload-app@v27
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          tdc_token: ${{ secrets.TDC_TOKEN }}
