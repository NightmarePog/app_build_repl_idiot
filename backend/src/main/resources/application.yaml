spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    properties:
      hibernate.mapping.default_list_semantics: LIST
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:seed
    connect-retries: 30
  mvc:
    static-path-pattern: /stops-images/**
  web:
    resources:
      static-locations: classpath:/seed/stopsImages/
  application:
    name: 2idiotz

app:
  # Required as a Bearer token for POST, PUT and DELETE; GET endpoints stay public.
  admin-api-key: ${ADMIN_API_KEY:Kyqc49jIM+5+D0Sed8ZQ671gxkd7W/bBTWjDtZ0Zrgk=}

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful
