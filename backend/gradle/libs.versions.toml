[versions]
spring-boot = "4.1.1"
spotless = "7.0.4"
springdoc = "3.1.1"
swagger = "2.2.55"

[libraries]
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
commons-csv = { module = "org.apache.commons:commons-csv", version = "1.14.1" }
lombok = { module = "org.projectlombok:lombok" }
spring-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
